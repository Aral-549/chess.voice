<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;
  background:#0d0906;
  background-image:
    radial-gradient(1500px 900px at 50% 42%, rgba(232,168,56,.13), transparent 62%),
    radial-gradient(900px 700px at 88% 92%, rgba(90,190,140,.06), transparent 60%);}
.stage{position:absolute;inset:0;display:grid;place-items:center}
.rig{transform:perspective(2400px) rotateX(56deg) rotateZ(-34deg) scale(.82);
  transform-style:preserve-3d;filter:drop-shadow(0 80px 120px rgba(0,0,0,.85))}
.grid{display:grid;grid-template-columns:repeat(16,72px);gap:6px;align-items:end}
.cell{width:72px;border-radius:6px;position:relative}
/* left: solid board squares. right: the same grid pulled up into waveform bars */
.sq{height:72px}
.sq.l{background:linear-gradient(160deg,#efe2cb,#d8c6a8)}
.sq.d{background:linear-gradient(160deg,#5a4130,#3d2b1e)}
.bar{background:linear-gradient(180deg,#ffd483,#e8a838 55%,#a86f14);
  box-shadow:0 0 34px rgba(232,168,56,.55),0 0 90px rgba(232,168,56,.25)}
.king{position:absolute;left:50%;top:-118px;transform:translateX(-50%);
  font-size:118px;line-height:1;color:#fff4dd;
  text-shadow:0 0 40px rgba(255,212,131,.9),0 0 110px rgba(232,168,56,.6),0 8px 22px rgba(0,0,0,.8)}
/* concentric rings radiating from the piece, flat on the board plane */
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(232,168,56,.5)}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1250px 820px at 50% 50%, transparent 30%, rgba(0,0,0,.80) 100%)}
</style></head><body>
<div class="stage"><div class="rig">
  <div class="rings" id="rings"></div>
  <div class="grid" id="g"></div>
</div></div>
<div class="vig"></div>
<script>
const g=document.getElementById('g');
// 16 columns x 8 rows. Columns 0-7 stay a board; 8-15 rise into a waveform.
const wave=[0.30,0.62,0.95,0.70,1.25,0.85,1.55,0.48];
for(let r=0;r<8;r++)for(let c=0;c<16;c++){
  const d=document.createElement('div'); d.className='cell';
  if(c<8){ d.classList.add('sq',(r+c)%2?'d':'l'); }
  else {
    // only the bottom band becomes bars, so the board reads as dissolving
    if(r<4){ d.style.height='72px'; d.style.background='transparent'; }
    else { d.classList.add('bar');
      const h=Math.round(72*wave[(c-8)]*(1+(7-r)*0.10)); d.style.height=h+'px'; }
  }
  g.appendChild(d);
}
// No piece glyph: the squares already read as a board, and a small rotated
// knight only competed with the waveform for attention.
const rings=document.getElementById('rings');
[320,560,830,1140,1480].forEach((s,i)=>{const e=document.createElement('div');
  e.className='ring'; e.style.width=s+'px'; e.style.height=s+'px';
  e.style.opacity=(0.55-i*0.09).toFixed(2); e.style.borderWidth=(2.4-i*0.3)+'px';
  rings.appendChild(e);});
</script></body></html>
